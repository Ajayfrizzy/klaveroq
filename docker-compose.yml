services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: klaveroq
      POSTGRES_USER: klaveroq
      POSTGRES_PASSWORD: klaveroq_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaveroq -d klaveroq"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - klaveroq_postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: klaveroq_test
      POSTGRES_USER: klaveroq_test
      POSTGRES_PASSWORD: klaveroq_test
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaveroq_test -d klaveroq_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  klaveroq_postgres:
