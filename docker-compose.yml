services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: klaveroq
      POSTGRES_USER: klaveroq
      POSTGRES_PASSWORD: klaveroq_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaveroq -d klaveroq"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - klaveroq_postgres:/var/lib/postgresql/data

volumes:
  klaveroq_postgres:
